name: Build and Deploy Next.js App (Staging)

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: DO_HOST

    steps:
      # 1️⃣ Checkout
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js 20
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3️⃣ Install dependencies (CI only)
      - name: 📦 Install Dependencies
        run: npm ci

      # 4️⃣ Clean build cache
      - name: 🧹 Clean Cache
        run: |
          rm -rf .next
          rm -rf .turbo

      # 5️⃣ Build Next.js (SERVER MODE)
      - name: 🏗️ Build Next.js App
        run: npm run build
        env:
          NODE_ENV: production

      # 6️⃣ Upload build artifacts to server (FIXED)
      - name: 🚀 Upload Build to DigitalOcean
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          source: ".next/**,public/**,node_modules/**,package.json,next.config.js,.env.production"
          target: /var/www/OurBrideWeb-staging
          rm: false

      # 7️⃣ Restart app using PM2
      - name: 🔁 Restart App with PM2
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 20

            export PATH="$HOME/.nvm/versions/node/v20.20.0/bin:$PATH"

            cd /var/www/OurBrideWeb-staging

            pm2 reload ourbride-staging || \
            PORT=3001 pm2 start node_modules/.bin/next \
              --name ourbride-staging \
              -- start -p 3001

            pm2 save

      # 8️⃣ Reload Nginx
      - name: 🔄 Reload Nginx
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          script: |
            sudo nginx -t
            sudo systemctl reload nginx
