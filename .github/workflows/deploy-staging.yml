name: Build and Deploy Next.js App (Staging)

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: DO_HOST

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Next.js App (Staging)
        run: npm run build
        env:
          NEXT_DISABLE_TURBOPACK: 1
          NODE_ENV: production

      - name: 🚀 Deploy Static Export to DigitalOcean (Staging)
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          source: "out/*"
          target: "/var/www/OurBrideWeb-staging/build"
          rm: true
          strip_components: 1

      - name: 📱 Deploy .well-known Files
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          source: "out/.well-known/*"
          target: "/var/www/OurBrideWeb-staging/build/.well-known"
          strip_components: 2

      - name: 🔧 Fix Permissions
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          script: |
            sudo chown -R www-data:www-data /var/www/OurBrideWeb-staging
            sudo chmod -R 755 /var/www/OurBrideWeb-staging

      - name: 🔄 Reload Nginx
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          script: |
            sudo systemctl reload nginx
