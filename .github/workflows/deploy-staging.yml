name: Build and Deploy Next.js App (Staging)

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: DO_HOST

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧹 Clean Build Cache
        run: |
          rm -rf .next
          rm -rf .turbo
          npm cache clean --force

      - name: 🏗️ Build Next.js App (Staging)
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🚀 Deploy Next.js App to DigitalOcean (Staging)
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          source: ".next/**,package.json,package-lock.json,next.config.js,public/**,.env.production,.env.local"
          target: "/var/www/OurBrideWeb-staging"
          rm: false

      - name: 📦 Install Dependencies on Server
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          script: |
            cd /var/www/OurBrideWeb-staging
            # Ensure Node.js 20 is used (using nvm if available)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" || true
            if command -v nvm &> /dev/null || [ -s "$NVM_DIR/nvm.sh" ]; then
              nvm use 20 || nvm install 20 || true
            fi
            # Verify Node version (must be >=20.9.0 for Next.js 16)
            NODE_VERSION=$(node --version | cut -d'v' -f2 | cut -d'.' -f1)
            if [ "$NODE_VERSION" -lt 20 ]; then
              echo "ERROR: Node.js version must be >=20.9.0. Current: $(node --version)"
              echo "Please install Node.js 20 on the server"
              exit 1
            fi
            # Install dependencies - use npm install if lock file is out of sync
            npm install --omit=dev || npm ci --omit=dev

      - name: 🔄 Restart App (PM2)
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          script: |
            cd /var/www/OurBrideWeb-staging
            pm2 restart ourbride-staging || pm2 start npm --name "ourbride-staging" -- start

      - name: 🔧 Fix Permissions
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          script: |
            sudo chown -R ${{ secrets.DO_USER }}:${{ secrets.DO_USER }} /var/www/OurBrideWeb-staging
            sudo chmod -R 755 /var/www/OurBrideWeb-staging

      - name: 🔄 Reload Nginx
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          script: |
            sudo systemctl reload nginx
