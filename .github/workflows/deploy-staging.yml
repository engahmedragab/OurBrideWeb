name: Build and Deploy Next.js App (Staging)

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: DO_HOST

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧹 Clean Cache
        run: |
          rm -rf .next out

      - name: 🏗️ Build & Export Static Site
        run: npm run build

      - name: ✅ Verify Static Export
        run: |
          if [ ! -d "out" ]; then
            echo "❌ Static export failed: out/ not found"
            exit 1
          fi

      - name: 🚀 Deploy Static Site to Server
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          source: "out/*"
          target: "/var/www/OurBrideWeb-staging/build"
          rm: true
          strip_components: 1

      - name: 🔄 Reload Nginx
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          script: sudo systemctl reload nginx
