name: Build and Deploy React App (Staging)

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: DO_HOST

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: 📦 Install Dependencies
        run: npm ci
        env:
          CI: false

      - name: 🏗️ Build React App (Staging)
        run: npm run build
        env:
          CI: false
          REACT_APP_ENV: staging

      - name: 🚀 Deploy to DigitalOcean (Staging)
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          source: "build/*"
          target: "/var/www/OurBrideWeb-staging/build"
          rm: true
          strip_components: 1

      - name: 📱 Deploy .well-known Files
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          source: "build/.well-known/*"
          target: "/var/www/OurBrideWeb-staging/build/.well-known"
          strip_components: 2

      - name: 🔧 Fix Permissions
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          script: |
            sudo chown -R www-data:www-data /var/www/OurBrideWeb-staging
            sudo chmod -R 755 /var/www/OurBrideWeb-staging

      - name: 🔄 Reload Nginx
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          script: |
            sudo systemctl reload nginx
