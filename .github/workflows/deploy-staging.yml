name: Build and Deploy Next.js App (Staging)

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: DO_HOST

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧹 Clean Build Cache
        run: |
          rm -rf .next
          rm -rf .turbo
          npm cache clean --force

      - name: 🏗️ Build Next.js App (Staging)
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🚀 Deploy Next.js App to DigitalOcean (Staging)
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          source: ".next/**,package.json,package-lock.json,next.config.js,public/**,.env.production,.env.local"
          target: "/var/www/OurBrideWeb-staging"
          rm: false

      - name: 📦 Install Dependencies on Server
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          script: |
            cd /var/www/OurBrideWeb-staging
            npm ci --production

      - name: 🔄 Restart Next.js App
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          script: |
            cd /var/www/OurBrideWeb-staging
            # Restart the app using PM2 or systemd (adjust based on your setup)
            # If using PM2:
            # pm2 restart ourbride-staging || pm2 start npm --name "ourbride-staging" -- start
            # If using systemd:
            sudo systemctl restart ourbride-staging || sudo systemctl start ourbride-staging
            # If using a simple process manager, you might need to:
            # pkill -f "next start" || true
            # nohup npm start > /var/log/ourbride-staging.log 2>&1 &

      - name: 🔧 Fix Permissions
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          script: |
            sudo chown -R ${{ secrets.DO_USER }}:${{ secrets.DO_USER }} /var/www/OurBrideWeb-staging
            sudo chmod -R 755 /var/www/OurBrideWeb-staging

      - name: 🔄 Reload Nginx
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          script: |
            sudo systemctl reload nginx
