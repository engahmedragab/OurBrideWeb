name: Build and Deploy React App

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: DO_HOST

    steps:
      # 1️⃣ Checkout
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js 20 (same style as staging)
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3️⃣ Install dependencies (CI only)
      - name: 📦 Install Dependencies
        run: npm ci
        env:
          CI: false

      # 4️⃣ Clean build cache (optional but consistent)
      - name: 🧹 Clean Cache
        run: |
          rm -rf build
          rm -rf node_modules/.cache

      # 5️⃣ Build React App
      - name: 🏗️ Build React App
        run: npm run build
        env:
          CI: false

      # 6️⃣ Deploy React build to DigitalOcean (same location)
      - name: 🚀 Deploy to DigitalOcean via SCP
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          source: "build/*"
          target: "/var/www/OurBrideWeb/build"
          rm: true
          strip_components: 1

      # ✅ Keep the .well-known section
      - name: 📱 Deploy .well-known Files
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          source: "build/.well-known/*"
          target: "/var/www/OurBrideWeb/build/.well-known"
          strip_components: 2

      - name: 🔧 Set .well-known Permissions
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          script: |
            sudo chown -R www-data:www-data /var/www/OurBrideWeb/build/.well-known
            sudo chmod -R 755 /var/www/OurBrideWeb/build/.well-known

      # 8️⃣ Reload Nginx
      - name: 🔄 Reload Nginx
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          port: 22
          script: |
            sudo nginx -t
            sudo systemctl reload nginx
